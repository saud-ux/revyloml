# Render Blueprint — New > Blueprint, point it at this repo.
#
# This is the FREE setup: a free Render web service, with Postgres and file
# storage on Supabase's free tier. Render's own free Postgres expires after
# about 30 days and free instances get no disk, so neither can hold anything
# you want to keep.
#
# Before deploying, in Supabase:
#   1. Create a project. Copy the connection string into DATABASE_URL.
#   2. Storage > New bucket, named "media", marked PUBLIC.
#   3. Copy the service_role key into SUPABASE_SERVICE_KEY. It bypasses row
#      level security, so it belongs only in this server's environment.
#
# A free instance sleeps after ~15 minutes idle, and the first visitor to a
# shared link then waits ~1 minute. Point an external pinger (cron-job.org,
# UptimeRobot, a GitHub Actions schedule) at:
#
#   https://<your-service>.onrender.com/api/health          every 10 minutes
#   https://<your-service>.onrender.com/api/health?deep=1   once a day
#
# Two pings, because they keep two different things alive. The frequent one
# touches no database, so it costs nothing on Supabase's free tier. The daily
# one runs a single query, because Supabase pauses a free project after about a
# week with no database activity — without it a quiet month would take the site
# down and the shallow ping would never notice.
#
# One always-awake free service fits inside Render's monthly free
# instance-hours; a second one would not.
#
# To move to the paid setup instead: change plan to "starter", add a disk at
# /var/data, set UPLOAD_DIR=/var/data/uploads, and drop the SUPABASE_* storage
# variables — files then go to the disk and the pinger is unnecessary.

services:
  - type: web
    name: revyloml
    runtime: node
    plan: free
    # Co-located with the Supabase project (ap-southeast-1). Every page render
    # queries the database, so the web service belongs next to it — a visitor's
    # single round trip beats the server making several across an ocean.
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Supabase > Project settings > Database > Connection string (URI).
      - key: DATABASE_URL
        sync: false
      # The password you want. Typed here, hashed at boot.
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Supabase > Project settings > API.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: media
