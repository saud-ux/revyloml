# Render Blueprint — New > Blueprint, point it at this repo.
#
# It creates the web service and the Postgres database, wires DATABASE_URL, and
# generates SESSION_SECRET. Two things it cannot do for you:
#
#   1. ADMIN_PASSWORD is marked sync:false, so Render asks you for it — just
#      type the password you want. No terminal needed. If you prefer to store a
#      hash instead, run `npm run hash-password -- "..."` and set
#      ADMIN_PASSWORD_HASH instead; it wins when both are present.
#   2. The disk needs a paid instance type. The audio files live on it; the
#      container filesystem is wiped on every deploy, so without a disk every
#      upload disappears at the next deploy.
#
# Plan names change over time — if Render rejects one, pick the equivalent in
# the UI and the rest of the blueprint still applies.

services:
  - type: web
    name: revyloml
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ar
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: revyloml-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: revyloml-db
    databaseName: revyloml
    plan: basic-256mb
